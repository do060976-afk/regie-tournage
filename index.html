<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Régie de tournage</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{
  /* --- Light : papier de production --- */
  --bg:#ece6dc;
  --surface:#f5efe4;
  --ink:#1a1a1a;
  --muted:#6b6259;
  --line:#d8cfc1;
  --rec:#c92b1c;
  --tape:#e8b931;
  --ok:#3a7d44;
  --hero-bg:#1a1a1a;
  --hero-fg:#f5efe4;
  --btn-bg:#1a1a1a;
  --btn-fg:#f5efe4;
  --card-shadow:0 1px 2px rgba(60,50,40,0.06),0 2px 8px rgba(60,50,40,0.05);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  /* --- Dark : nuit de tournage --- */
  --bg:#14110e;
  --surface:#1f1b17;
  --ink:#f0e9dc;
  --muted:#a89b88;
  --line:#3a322a;
  --rec:#ff5544;
  --tape:#f4c94a;
  --ok:#8acd8a;
  --hero-bg:#0a0805;
  --hero-fg:#f0e9dc;
  --btn-bg:#2e2620;
  --btn-fg:#f0e9dc;
  --card-shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box}
html, body { max-width: 100%; overflow-x: hidden; }
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  line-height:1.55;
  -webkit-tap-highlight-color: transparent;
  word-wrap: break-word;
  overflow-wrap: break-word;
}
::selection{background:var(--tape);color:#1a1a1a}

.wrap{max-width:860px;margin:0 auto;padding:16px; width: 100%;}
header.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap; margin-bottom: 10px; width: 100%;}
h1{font-size:1.2rem;font-weight:800;margin:0;display:flex;align-items:center;gap:8px;letter-spacing:-.015em}
.dot{width:12px;height:12px;border-radius:50%;background:var(--rec);animation:blink 1.4s infinite;box-shadow:0 0 0 3px color-mix(in srgb,var(--rec) 18%,transparent)}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}

.hero{
  margin:16px 0 10px;
  padding:24px 22px;
  background:var(--hero-bg);
  color:var(--hero-fg);
  border-radius:8px;
  border-bottom:8px solid var(--tape);
  width: 100%; box-sizing: border-box;
}
.hero small{opacity:.82}
#cd{font-size:clamp(2.8rem,13vw,5.2rem);font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.02}
.bar{height:10px;background:rgba(255,255,255,.14);border-radius:5px;margin-top:14px;overflow:hidden}
#bar{height:100%;background:var(--rec);width:0;transition:width .4s ease}

nav{display:flex;gap:4px;overflow-x:auto;margin:16px 0;border-bottom:2px solid var(--line); -webkit-overflow-scrolling: touch; scrollbar-width: none; width: 100%;}
nav::-webkit-scrollbar { display: none; }
nav button{flex:0 0 auto;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:color .15s}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--rec)}

button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label:focus-visible{outline:3px solid var(--tape);outline-offset:2px}

section.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:8px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:var(--card-shadow);
  width: 100%; box-sizing: border-box; overflow: hidden;
}
h2{
  font-size:1.15rem;
  font-weight:800;
  margin:0 0 12px;
  padding-left:12px;
  border-left:3px solid var(--tape);
  letter-spacing:-.015em;
  line-height:1.25;
}
h3{
  font-size:1rem;
  font-weight:700;
  margin:18px 0 6px;
  letter-spacing:-.005em;
}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:3px}

input,select,textarea{
  font:inherit;color:var(--ink);
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:5px;
  padding:8px 10px;
  width:100%;min-width:0;
  box-sizing: border-box; max-width: 100%;
}
input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--rec)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.row{display:flex;gap:8px;align-items:center;padding:11px 0;border-top:1px solid var(--line);flex-wrap:wrap; width: 100%;}
.row.first{border-top:0}
.grow{flex:1 1 140px;min-width:0}
.who{flex:0 1 150px}.dt{flex:0 1 150px}.num{flex:0 0 110px}.tm{width:120px}

.btn{
  font:inherit;font-weight:700;
  border:0;border-radius:5px;
  padding:9px 16px;
  background:var(--btn-bg);
  color:var(--btn-fg);
  cursor:pointer;text-align:center;text-decoration:none;
  display: inline-block; box-sizing: border-box;
  letter-spacing:-.005em;
}
.btn.ghost{background:none;color:var(--muted);border:1px solid var(--line);padding:7px 11px;font-weight:600}
.btn.ghost:hover{color:var(--ink)}

.phase{
  display:grid;grid-template-columns:1fr 78px;gap:4px 10px;
  padding:12px 14px;
  border-left:6px solid var(--line);
  margin-bottom:6px;
  background:var(--bg);
  border-radius:0 6px 6px 0;
  width: 100%;
}
.phase.now{border-color:var(--rec);background:color-mix(in srgb,var(--tape) 30%,var(--bg))}
.phase.past{opacity:.55;border-color:var(--ok)}
.phase small{color:var(--muted)}

.st{
  font-weight:700;font-size:.9rem;
  border-radius:14px;padding:5px 14px;
  border:2px solid var(--line);
  background:none;color:var(--ink);
  cursor:pointer;font-family:inherit;
  display: inline-block;letter-spacing:-.005em;
}
.st.s1{border-color:var(--tape);background:var(--tape);color:#1a1a1a}
.st.s2{border-color:var(--ok);background:var(--ok);color:#1a1a1a}

.done{text-decoration:line-through;color:var(--muted)}
.warn{color:var(--rec);font-weight:700}
.muted{color:var(--muted);font-size:.9rem}

.add{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px; width: 100%;}
.add input{flex:1 1 120px}

.banner{background:var(--tape);color:#1a1a1a;padding:10px 14px;border-radius:6px;margin-top:12px;font-weight:700; word-break: break-word;}

.sheet { width: 100%; overflow-x: auto; }
.sheet table{width:100%;border-collapse:collapse; min-width: 500px;}
.sheet td,.sheet th{text-align:left;padding:6px 8px 6px 0;border-bottom:1px solid var(--line);vertical-align:top; word-break: break-word;}
a.map-link{color:var(--muted);text-decoration:underline;text-underline-offset:2px; word-break: break-all;}
a.map-link:hover{color:var(--ink)}

/* --- MENU OUTILS --- */
.header-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; max-width: 100%;}
.tools-menu { position: relative; display: inline-block; max-width: 100%;}
.tools-menu summary { list-style: none; cursor: pointer; user-select: none; }
.tools-menu summary::-webkit-details-marker { display: none; }
.tools-content { position: absolute; right: 0; top: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; z-index: 100; box-shadow: 0 8px 24px rgba(0,0,0,0.15); min-width: 170px; max-width: 90vw; margin-top: 5px; box-sizing: border-box;}
.tools-content button, .tools-content label { width: 100%; text-align: left; margin: 0; padding: 10px; box-sizing: border-box; white-space: normal;}
.tools-content .btn.ghost { border: 0; background: var(--bg); }

/* --- STYLES MODE LECTURE SEULE --- */
body.readonly [data-add], body.readonly [data-del], body.readonly .add, body.readonly button[data-act="del_room"], body.readonly button[data-act="leave"], body.readonly label[for="fileIn"], body.readonly button[data-act="paste"], body.readonly button[data-act="export"], body.readonly input[type="file"] { display: none !important; }
body.readonly input, body.readonly select { pointer-events: none; border: none; background: transparent; padding: 0; appearance: none; color: var(--ink); font-weight: 600; }
body.readonly input[type="number"]::-webkit-inner-spin-button { display: none; }
body.readonly .st { pointer-events: none; border-color: transparent; background: transparent; color: var(--muted); padding: 0; }
body.readonly input[type="checkbox"] { display: none; }

/* --- AMÉLIORATIONS SPÉCIFIQUES MOBILE --- */
@media (max-width: 600px) {
  .wrap { padding: 10px; }
  header.top { flex-direction: column; align-items: stretch; }
  h1 { justify-content: center; margin-bottom: 10px; }
  .header-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
  .header-actions .muted { grid-column: 1 / -1; text-align: center; margin-bottom: 5px; }
  .header-actions > button { width: 100%; margin: 0; padding: 12px; }
  .header-actions > details { grid-column: 1 / -1; width: 100%; }
  .tools-menu { width: 100%; }
  .tools-menu summary { width: 100%; display: block; text-align: center; margin: 0; padding: 12px; }
  .tools-content { position: absolute; left: 0; right: 0; width: 100%; min-width: 0; box-sizing: border-box; }
  .tools-content button, .tools-content label { text-align: center; padding: 12px; font-size: 1rem; }
  .hero { padding: 18px; margin: 12px 0 8px; }
  nav { margin: 12px 0; }
  nav button { padding: 12px 16px; font-size: 0.95rem; }
  section.card { padding: 14px; }
  h2 { padding-left: 10px; }
  .row { flex-direction: column; align-items: stretch; gap: 8px; padding: 12px 0; }
  .row > div, .row > input, .row > select { width: 100%; max-width: 100%; }
  .who, .dt, .num, .tm { width: 100%; flex: 1 1 auto; }
  .add { flex-direction: column; }
  .add input { width: 100%; margin-bottom: 4px; flex: none; }
  .add .btn { width: 100%; padding: 12px; }
  input, select, textarea { font-size: 16px; padding: 10px; }
  .btn.ghost { padding: 12px; text-align: center; }
  .delBtn { width: 100%; padding: 12px; margin-top: 4px; border: 1px dashed var(--line); color: var(--rec); }
  .st { width: 100%; text-align: center; padding: 10px; }
  .grid { grid-template-columns: 1fr; }
  .sheet table { font-size: 0.85rem; }
}

textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:10px;width:100%;min-height:90px}

.toast{
  position:fixed;left:12px;right:12px;
  bottom:calc(12px + env(safe-area-inset-bottom,0px));
  background:var(--hero-bg);color:var(--hero-fg);
  padding:14px;border-radius:8px;font-weight:600;
  z-index:10000;border-left:8px solid var(--tape);
  box-shadow:0 8px 24px rgba(0,0,0,0.25);
}

@media print{
  :root,:root[data-theme="dark"]{
    --bg:#fff;--surface:#fff;--ink:#000;--muted:#333;--line:#999;
    --tape:#e8e0d0;--rec:#000;--ok:#555;
    --hero-bg:#fff;--hero-fg:#000;
    --btn-bg:#000;--btn-fg:#fff;
    --card-shadow:none;
    color-scheme:light
  }
  header.top,.hero,nav,.noprint,.banner{display:none!important}
  section.card{border:0;padding:0;box-shadow:none}
  h2{border-left:0;padding-left:0}
  .wrap{padding:0}
}
</style>

<body>
<div class="wrap">
<header class="top">
  <h1><span class="dot"></span>Régie de tournage</h1>
  <div class="header-actions">
    <span class="muted" id="sync"></span>
    <button class="btn ghost" data-act="copy">Lien équipe</button>
    <button class="btn ghost" data-act="copy_ro">Lien lecture</button>

      <summary class="btn ghost">Outils ⚙️</summary>

        <button class="btn ghost" data-act="leave" id="leave" hidden>Changer d’équipe</button>

        <button class="btn ghost" data-act="export">Sauvegarder</button>
        <label for="fileIn" class="btn ghost">Fichier</label>
        <button class="btn ghost" data-act="paste">Coller</button>
        <button class="btn ghost" data-act="alerts" id="alertBtn">Alertes</button>
        <button class="btn ghost" id="theme">Thème</button>
      </div>
    </details>
  </div>
</header>
<div id="ban"></div>
<div class="hero"><small id="cdl">Chargement…</small><div id="cd">--:--:--</div><div class="bar"><div id="bar"></div></div><small id="cph"></small></div>
<nav role="tablist" id="tabs"></nav>
<main id="main"></main>
</div>

<!-- FENÊTRE POUR COLLER LE TEXTE -->
<div id="importModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:9999; padding:20px; align-items:center; justify-content:center; box-sizing: border-box;">
  <div style="background:var(--surface); padding:20px; border-radius:8px; width:100%; max-width:500px; box-shadow:0 4px 15px rgba(0,0,0,0.3); box-sizing: border-box;">
    <h3>Coller la sauvegarde</h3>

    <textarea id="importText" style="height:150px; font-family:monospace; margin-bottom:15px; font-size:12px; width: 100%; box-sizing: border-box;" placeholder='{"version":2,"room":"...","data":{...}}'></textarea>
    <div style="display:flex; gap:10px; justify-content:flex-end;">
      <button class="btn ghost" id="cancelImportText">Annuler</button>
      <button class="btn" id="doImportText">Restaurer</button>
    </div>
  </div>
</div>
<input type="file" id="fileIn" accept=".json,application/json,text/plain" style="position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; z-index:-1;">

<script>
/* ====== 1. CONFIGURATION FIREBASE ====== */
const FIREBASE_CONFIG={
  apiKey: "AIzaSyCzk6k3G79WZU7tvp-RnslRfwB7hLrF_8",

};
/* ====================================== */

/* ====== CODE ADMINISTRATEUR ====== */
const ADMIN_CODE = "cinema";
/* ================================= */

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SYNC=typeof firebase!=='undefined'&&!/COLLEZ/.test(FIREBASE_CONFIG.apiKey)&&!!FIREBASE_CONFIG.databaseURL;
const isRO = /readonly/.test(location.search+location.hash);
if(isRO) document.body.classList.add('readonly');

const LK='regie48h_local',RK='regie48h_room';
const p2=n=>String(Math.floor(n)).padStart(2,'0');
const nextHour=()=>{const d=new Date();d.setMinutes(0,0,0);d.setHours(d.getHours()+1);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'T'+p2(d.getHours())+':00'};
const obj=(a,f)=>Object.fromEntries(a.map((x,i)=>['d'+i,Object.assign(f(x),{o:i})]));
const isoD=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const DEF=(mode)=>({init:1,mode:mode||'48h',bud:0,permis:obj(['Autorisation de tournage (lieux)','Décharges de droit à l’image','Droits musicaux'],t=>({t,type:'',who:'',s:0})),budget:obj(['Location de matériel','Repas','Transports','Décors et accessoires','Musique et droits','Assurance'],t=>({t,est:0,real:0})),start:nextHour(),
cph:obj([['Préproduction',0,13,0],['Tournage',14,18,1],['Postproduction',19,48,0],['Livraison',49,49,0]],x=>({n:x[0],from:isoD(x[1]),to:isoD(x[2]),s:x[3]})),
phases:[{n:'Écriture',h:3},{n:'Préparation et repérages',h:3},{n:'Tournage',h:18},{n:'Montage et son',h:15},{n:'Export et dépôt',h:3},{n:'Marge de sécurité',h:6}],
c:{genre:'',perso:'',objet:'',replique:''},
tasks:obj(['Charger les batteries et vider les cartes mémoire','Prévoir repas et eau pour toute l’équipe','Obtenir les autorisations de tournage','Tester l’export final bien avant la deadline'],t=>({t,who:'',s:0})),
gear:obj(['Caméra et objectifs','Micro et perche','Trépied','Lumières','Cartes mémoire','Batteries chargées','Disque SSD','Câbles et rallonges','Ordinateur de montage','Casque audio','Clap'],t=>({t,who:'',k:0})),
timeline:{} });
let S={},ready=false,R=null,room='',pending=false,tab='chrono',newMode='48h',curDay='';
const TABS=[['chrono','Chrono'],['timeline','Journée'],['equipe','Équipe'],['taches','Tâches'],['scenes','Scènes'],['matos','Matériel'],['sommeil','Sommeil'],['budget','Budget'],['permis','Autorisations'],['rapport','Rapport'],['feuille','Feuille de service']];
const ST=['À faire','En cours','Fait'],SS=['À tourner','En cours','Tournée'];
const tabs=()=>S.mode==='classic'?[['chrono','Planning'],['timeline','Journée'],['equipe','Équipe'],['taches','Tâches'],['scenes','Scènes'],['matos','Matériel'],['budget','Budget'],['permis','Autorisations'],['rapport','Rapport'],['feuille','Feuille de service']]:TABS;
const msD=(d,end)=>new Date(d+(end?'T23:59:59':'T00:00:00')).getTime();
const fmtD=d=>new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const todayS=()=>isoD(0);
const dayKey=()=>S.mode==='classic'?curDay:(S.start||'').slice(0,10);
const convKey=()=>S.mode==='classic'?(curDay||'x'):'x';
function normDay(){const sp=L('cph').find(p=>p.s)||{},days=[];
  if(sp.from&&sp.to){for(let d=new Date(sp.from+'T12:00:00'),i=0;i<60;i++){const q=ymd(d);if(q>sp.to)break;days.push(q);d.setDate(d.getDate()+1)}}
  if(!days.includes(curDay))curDay=days.includes(todayS())?todayS():(days[0]||'');return days}
const WX={},WXT={},wxKey=()=>((S.c||{}).ville||'')+'|'+dayKey();
const wmo=c=>c===0?'Ciel dégagé':c<=3?'Nuageux':c<=48?'Brouillard':c<=67?'Pluie':c<=77?'Neige':c<=82?'Averses':'Orage';
const wxBlock=()=>`<div class="noprint"><label for="vil">Ville du tournage (météo)</label><input id="vil" data-c="ville" value="${esc((S.c||{}).ville)}"><br><br><button class="btn ghost" data-act="wx">Actualiser la météo</button></div><p id="wx"></p>`;
async function loadWx(){
  const out=h=>{const e=$('#wx');if(e)e.innerHTML=h};
  const v=((S.c||{}).ville||'').trim(),day=dayKey(),key=wxKey();
  if(!v||!day){out(v?'':'<span class="muted">Indiquez une ville pour afficher la météo.</span>');return}

const DEBOUNCE_MS = 350;
const pendingWrites = {};

function savePending(){
  if(!SYNC || !room) return;
  const p = {};
  Object.entries(pendingWrites).forEach(([path,w])=>{p[path]=w.v});
  try{
    const key='regie_pending_'+room;
    if(Object.keys(p).length) localStorage.setItem(key, JSON.stringify(p));
    else localStorage.removeItem(key);
  }catch(e){}
}

function loadPending(){
  if(!SYNC || !room) return;
  try{
    const p = JSON.parse(localStorage.getItem('regie_pending_'+room) || '{}');
    Object.entries(p).forEach(([path,v])=>{
      pendingWrites[path] = {
        v: v,
        timer: setTimeout(()=>{
          const w = pendingWrites[path];
          if(!w) return;
          delete pendingWrites[path];
          savePending();
          if(R) R.child(path).set(w.v==null?null:w.v).catch(e=>console.warn('FB write failed',path,e));
        }, DEBOUNCE_MS)
      };
    });
  }catch(e){}
}

function mergePending(serverVal){
  const v = serverVal || {};
  Object.entries(pendingWrites).forEach(([path,w])=>{
    setIn(v, path.split('/'), w.v);
  });
  return v;
}

function flushPending(){
  if(!SYNC || !R) return;
  Object.keys(pendingWrites).forEach(path=>{
    const w = pendingWrites[path];
    clearTimeout(w.timer);
    R.child(path).set(w.v==null?null:w.v).catch(e=>console.warn('FB write failed',path,e));
    delete pendingWrites[path];
  });
  savePending();
}

function put(path, v, immediate){
  if(isRO) return;
  setIn(S, path.split('/'), v);
  const cacheKey = SYNC ? 'regie_cache_'+room : LK;
  try{ localStorage.setItem(cacheKey, JSON.stringify(S)) }catch(e){}
  if(!SYNC || !R) return;
  if(pendingWrites[path]){
    clearTimeout(pendingWrites[path].timer);
    delete pendingWrites[path];
  }
  if(immediate){
    R.child(path).set(v==null?null:v).catch(e=>console.warn('FB write failed',path,e));
    savePending();
    return;
  }
  pendingWrites[path] = {
    v: v,
    timer: setTimeout(()=>{
      const w = pendingWrites[path];
      if(!w) return;
      delete pendingWrites[path];
      savePending();
      R.child(path).set(w.v==null?null:w.v).catch(e=>console.warn('FB write failed',path,e));
    }, DEBOUNCE_MS)
  };
  savePending();
}

    <div class="row first muted"><div class="grow">Poste</div><div class="num">Estimé (€)</div><div class="num">Dépensé (€)</div><div style="width:38px"></div></div>${B.map(x=>`<div class="row"><input class="grow" data-edit="budget" data-id="${x.id}" data-f="t" value="${esc(x.t)}" aria-label="Poste"><input class="num" ${nm} data-edit="budget" data-id="${x.id}" data-f="est" data-num value="${x.est||''}" aria-label="Estimé"><input class="num" ${nm} data-edit="budget" data-id="${x.id}" data-f="real" data-num value="${x.real||''}" aria-label="Dépensé">${delBtn('budget',x.id)}</div>`).join('')}${addRow('budget','Poste de dépense','Estimé (€)','Dépensé (€)',nm,nm).replace(' list="who"','')}<p class="muted">Pensez aux repas, transports, assurance et droits musicaux.</p></section>`}
  if(tab==='sommeil'){const z=L('sleep').sort((a,b)=>new Date(a.at)-new Date(b.at)),tot={};z.forEach(x=>tot[x.who]=(tot[x.who]||0)+(+x.h||0));
    m.innerHTML=dl+`<section class="card"><h2>Plages de repos</h2>${z.map((x,i)=>{const s=new Date(x.at).getTime();return`<div class="row ${i?'':'first'}"><div class="grow"><strong>${esc(x.who)}</strong><br><span class="muted">${fmt(s)} → ${fmt(s+x.h*36e5)} (${x.h} h)</span></div>${delBtn('sleep',x.id)}</div>`}).join('')||'<p class="muted">Planifiez le sommeil de chacun, surtout du monteur : une équipe épuisée fait des erreurs.</p>'}
    ${Object.keys(tot).length?`<p class="muted">Total prévu : ${Object.entries(tot).map(([k,v])=>esc(k)+' '+v+' h').join(', ')}</p>`:''}${addRow('sleep','Personne','Début','Heures','type="datetime-local" aria-label="Début"','type="number" min="0" step="0.5"')}</section>`}
  if(tab==='feuille'&&S.mode==='classic'){
    const sp=L('cph').find(p=>p.s)||{},days=[];
    if(sp.from&&sp.to){for(let d=new Date(sp.from+'T12:00:00'),i=0;i<60;i++){const q=ymd(d);if(q>sp.to)break;days.push(q);d.setDate(d.getDate()+1)}}
    if(!days.includes(curDay))curDay=days.includes(todayS())?todayS():(days[0]||'');
    const sc=L('scenes').filter(x=>x.day===curDay),c=S.c||{};
    m.innerHTML=`<section class="card sheet"><div class="noprint"><label for="fd">Jour de tournage</label><select id="fd">${days.map(d=>`<option value="${d}"${d===curDay?' selected':''}>${fmtD(d)}</option>`).join('')}</select><br><br><button class="btn" data-act="print">Imprimer la feuille</button> <button class="btn ghost" data-act="share">Partager</button></div><h2>Feuille de service${curDay?' : '+fmtD(curDay):''}</h2>
    <p>${esc(c.titre)||'Projet sans titre'}${c.genre?' · '+esc(c.genre):''}</p>
    <h3>Scènes du jour</h3><table>${sc.map(x=>`<tr><td>${esc(x.n)}</td><td>${esc(x.l)}</td><td>${x.d||0} min</td><td>${SS[x.s]}</td></tr>`).join('')||'<tr><td>Aucune scène planifiée ce jour.</td></tr>'}</table>
    ${wxBlock()}
    <h3>Équipe</h3><table>${L('team').map(p=>`<tr><td>${esc(p.n)}</td><td>${esc(p.r)}</td><td>${esc(p.tel)}</td>${cv(p,curDay||'x')}</tr>`).join('')||'<tr><td>—</td></tr>'}</table>
    <h3>Matériel restant à rassembler</h3><p>${L('gear').filter(x=>!x.k).map(x=>esc(x.t)+(x.who?' ('+esc(x.who)+')':'')).join(', ')||'Tout est prêt.'}</p>
    <h3>Tâches en attente</h3><p>${L('tasks').filter(x=>x.s!==2).map(x=>esc(x.t)+(x.who?' ('+esc(x.who)+')':'')).join(', ')||'Rien en attente.'}</p></section>`}
  else if(tab==='feuille'){
    const T=times(),a=t0(),c=S.c||{};
    m.innerHTML=`<section class="card sheet"><div class="noprint"><button class="btn" data-act="print">Imprimer la feuille</button> <button class="btn ghost" data-act="share">Partager</button></div><h2>Feuille de service</h2>
    <p>Départ : <strong>${isNaN(a)?'—':fmt(a)}</strong> · Rendu : <strong>${isNaN(a)?'—':fmt(a+48*36e5)}</strong></p>
    <h3>Contraintes</h3><p>Genre : ${esc(c.genre)||'—'}<br>Personnage : ${esc(c.perso)||'—'}<br>Accessoire : ${esc(c.objet)||'—'}<br>Réplique : ${esc(c.replique)||'—'}</p>
    <h3>Planning</h3><table>${(S.phases||[]).map((p,i)=>`<tr><td>${esc(p.n)}</td><td>${isNaN(T[i][0])?'':fmt(T[i][0])+' → '+fmt(T[i][1])}</td></tr>`).join('')}</table>
    ${wxBlock()}
    <h3>Équipe</h3><table>${L('team').map(p=>`<tr><td>${esc(p.n)}</td><td>${esc(p.r)}</td><td>${esc(p.tel)}</td>${cv(p,'x')}</tr>`).join('')||'<tr><td>—</td></tr>'}</table>
    <h3>Scènes</h3><table>${L('scenes').map(x=>`<tr><td>${esc(x.n)}</td><td>${esc(x.l)}</td><td>${x.d||0} min</td><td>${SS[x.s]}</td></tr>`).join('')||'<tr><td>—</td></tr>'}</table>
    <h3>Repos</h3><table>${L('sleep').sort((x,y)=>new Date(x.at)-new Date(y.at)).map(x=>`<tr><td>${esc(x.who)}</td><td>${fmt(new Date(x.at).getTime())}</td><td>${x.h} h</td></tr>`).join('')||'<tr><td>—</td></tr>'}</table>
    <h3>Matériel restant à rassembler</h3><p>${L('gear').filter(x=>!x.k).map(x=>esc(x.t)+(x.who?' ('+esc(x.who)+')':'')).join(', ')||'Tout est prêt.'}</p></section>`}
  tick();updBud();if(tab==='feuille')loadWx();
}

document.querySelector('.tools-content').addEventListener('click', (e) => {
  if (e.target.closest('button') || e.target.closest('label')) {
    document.querySelector('.tools-menu').removeAttribute('open');
  }
});

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-add],[data-del],[data-st],[data-act]');if(!t)return;
  const v=id=>(($('#'+id)||{}).value||'').trim(),d=t.dataset;
  if(d.tab){tab=d.tab}
  else if(d.act==='print'){window.print();return}
  else if(d.act==='copy'){try{navigator.clipboard.writeText(location.origin+location.pathname+location.hash.split('?')[0]);t.textContent='Lien copié'}catch(x){}setTimeout(()=>t.textContent='Lien équipe',1500);return}
  else if(d.act==='alerts'){toggleAlerts();return}
  else if(d.act==='share'){shareSheet();return}
  else if(d.act==='wx'){delete WX[wxKey()];loadWx();return}
  else if(d.act==='copy_ro'){
    try{
      const url = location.origin + location.pathname + '?readonly=1' + location.hash.split('?')[0];
      navigator.clipboard.writeText(url);
      t.textContent='Lien copié';
    }catch(x){}
    setTimeout(()=>t.textContent='Lien lecture',1500);
    return;
  }
  else if(d.act==='leave'){try{localStorage.removeItem(RK)}catch(x){}history.replaceState(null,'',location.pathname);location.reload();return}
  else if(d.act==='del_room'){
    const code = prompt("🔒 Code administrateur requis pour supprimer cette équipe :");
    if (code === null) return;
    if (code !== ADMIN_CODE) {
      alert("Code incorrect. Suppression refusée.");
      return;
    }
    if(confirm("⚠️ ATTENTION : Voulez-vous vraiment supprimer définitivement ce projet pour TOUTE l'équipe ? Cette action est irréversible.")){
      if(R) R.remove().then(()=>{
        try{localStorage.removeItem(RK)}catch(x){}
        history.replaceState(null,'',location.pathname);
        location.reload();
      });
    }
    return;
  }
  else if(d.act==='export'){
    const exportData = { version: 2, room: room || "local", data: S };
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportData, null, 2));
    const dlAnchor = document.createElement('a');
    dlAnchor.setAttribute("href", dataStr);
    dlAnchor.setAttribute("download", "sauvegarde-" + (room || "local") + "-" + new Date().toISOString().slice(0,10) + ".json");
    document.body.appendChild(dlAnchor);
    dlAnchor.click();
    dlAnchor.remove();
    return;
  }
  else if(d.act==='paste'){
    $('#importModal').style.display = 'flex';
    $('#importText').value = '';
    return;
  }
  else if(d.act==='new'){
    const code = prompt("Code administrateur requis pour créer une nouvelle équipe :");
    if (code === null) return;
    if (code !== ADMIN_CODE) {
      alert("Code incorrect. La création d'équipe est refusée.");
      return;
    }
    let c=Array.from(crypto.getRandomValues(new Uint8Array(6)),b=>'abcdefghjkmnpqrstuvwxyz23456789'[b%31]).join('');
    newMode=($('#rm')||{}).value||'48h';
    room=c;history.replaceState(null,'','#'+room);try{localStorage.setItem(RK,room)}catch(x){}connect();
  }
  else if(d.add){const k=d.add,a1=v('a1'),a2=v('a2'),a3=v('a3');if(!a1&&k!=='timeline')return;const id=uid(),o=Date.now();
    if(k==='team')put('team/'+id,{n:a1,r:a2,tel:a3,o},true);
    if(k==='tasks')put('tasks/'+id,{t:a1,who:a2,s:0,o},true);
    if(k==='scenes')put('scenes/'+id,{n:a1,l:a2,d:+a3||0,s:0,day:v('a4'),o},true);
    if(k==='cph'){if(!a2||!a3){alert('Indiquez les dates de début et de fin.');return}put('cph/'+id,{n:a1,from:a2,to:a3,s:0,o},true)}
    if(k==='budget')put('budget/'+id,{t:a1,est:+a2||0,real:+a3||0,o},true);
    if(k==='permis')put('permis/'+id,{t:a1,type:a2,who:a3,s:0,o},true);
    if(k==='gear')put('gear/'+id,{t:a1,who:a2,k:0,o},true);
    if(k==='sleep'){if(!a2||!(+a3>0)){alert('Indiquez un début et une durée en heures.');return}put('sleep/'+id,{who:a1,at:a2,h:+a3,o},true)}
    if(k==='timeline')put('timeline/'+id,{start:a1,end:a2,desc:a3,o},true);
  }
  else if(d.del){put(d.del+'/'+d.id,null,true)}
  else if(d.st){const o=(S[d.st]||{})[d.id];if(o)put(d.st+'/'+d.id+'/s',((o.s||0)+1)%3,true)}
  view();
});
document.addEventListener('input',e=>{
  const t=e.target;
  // Frappes clavier → debounce Firebase, mise à jour locale immédiate
  if(t.dataset.c)put('c/'+t.dataset.c,t.value);
  else if(t.dataset.ph!==undefined){put('phases/'+t.dataset.ph+'/h',+t.value||0);tick()}
  else if(t.dataset.b!==undefined){put('bud',+t.value||0);updBud()}
  else if(t.dataset.num!==undefined){put(t.dataset.edit+'/'+t.dataset.id+'/'+t.dataset.f,+t.value||0);updBud()}
});
document.addEventListener('change',e=>{
  const t=e.target,d=t.dataset;
  // Les change ne firent qu'une fois par interaction → écriture immédiate
  if(t.id==='md'){put('mode',t.value,true);if(t.value==='classic'&&!S.cph)put('cph',DEF('classic').cph,true);view()}
  else if(t.id==='vil'){loadWx()}
  else if(t.id==='fd'){curDay=t.value;view()}
  else if(t.id==='st'){put('start',t.value,true);tick()}
  else if(d.chk){put(d.chk+'/'+d.id+'/k',t.checked?1:0,true);view()}
  else if(d.edit&&d.num===undefined)put(d.edit+'/'+d.id+'/'+d.f,t.value.trim(),true);
});
document.addEventListener('focusout',()=>setTimeout(()=>{if(pending&&!typing())view()},400));

// Bouton Thème : simple bascule clair ↔ sombre
$('#theme').onclick=()=>{
  const r=document.documentElement;
  r.dataset.theme = (r.dataset.theme==='dark') ? 'light' : 'dark';
};

window.addEventListener('hashchange',()=>location.reload());

// Envoie immédiatement les écritures en attente si l'app passe en arrière-plan
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushPending()});
window.addEventListener('pagehide',flushPending);
window.addEventListener('beforeunload',flushPending);

function processImport(parsed) {
  let targetRoom = room;
  let targetData = parsed;

  if (parsed.version === 2 && parsed.data) {
    targetRoom = parsed.room;
    targetData = parsed.data;
  }

  if (!targetRoom) {
    targetRoom = prompt("Code de l'équipe cible pour la restauration :");
    if (!targetRoom) return;
  }

  if (!confirm("⚠️ ATTENTION : Cela va écraser toutes les données actuelles de l'équipe '" + targetRoom + "'. Continuer ?")) return;

  if (SYNC) {
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.database();
    const ref = db.ref('rooms/' + targetRoom);

    ref.set(targetData).then(() => {
      alert("Restauration réussie ! Redirection vers l'équipe " + targetRoom);
      if (targetRoom !== room) {
        localStorage.setItem(RK, targetRoom);
        location.hash = '#' + targetRoom;
        location.search = '';
        location.reload();
      } else {
        view();
      }
    }).catch(err => alert("Erreur Firebase : " + err.message));
  } else {
    S = targetData;
    localStorage.setItem(LK, JSON.stringify(S));
    location.reload();
  }
}

$('#cancelImportText').onclick = () => { $('#importModal').style.display = 'none'; };
$('#doImportText').onclick = () => {
  const text = $('#importText').value.trim();
  if (!text) { alert("Veuillez coller le contenu du fichier."); return; }
  try {
    const parsed = JSON.parse(text);
    $('#importModal').style.display = 'none';
    processImport(parsed);
  } catch(err) {
    alert("Le texte collé n'est pas un JSON valide.");
  }
};

$('#fileIn').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(event) {
    try {
      const parsed = JSON.parse(event.target.result);
      setTimeout(() => processImport(parsed), 100);
    } catch (err) {
      alert("Erreur : le fichier sélectionné n'est pas un JSON valide.");
    }
    e.target.value = '';
  };
  reader.readAsText(file);
});

function connect(){
  $('#leave').hidden=false;
  $('#del_room').hidden=false;
  try{localStorage.setItem(RK, room)}catch(x){}
  if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
  const db=firebase.database();R=db.ref('rooms/'+room);
  db.ref('.info/connected').on('value',s=>{$('#sync').textContent=s.val()?'● Synchronisé · équipe '+room:'○ Hors ligne : les modifications partiront au retour du réseau'});
  ready=false;try{const c=JSON.parse(localStorage.getItem('regie_cache_'+room));if(c&&c.init){S=c;ready=true}}catch(x){}
  // Recharge les écritures en attente de la session précédente
  loadPending();
  view();
  R.on('value',s=>{
    const v=s.val();
    if(!v){if(!isRO)R.update(DEF(newMode));return}
    // Superpose les écritures locales non encore synchronisées
    S = mergePending(v);
    ready=true;
    try{localStorage.setItem('regie_cache_'+room, JSON.stringify(S))}catch(x){}
    if(typing()){pending=true;tick()}else view()
  },
  ()=>{$('#sync').textContent='Accès refusé : vérifiez les règles Firebase'});
}

if(SYNC){
  try{room=(location.hash||'').slice(1).split('?')[0].replace(/[^\w-]/g,'')||localStorage.getItem(RK)||''}catch(e){}
  if(room){history.replaceState(null,'','#'+room);connect()}else view();
}else{
  try{S=JSON.parse(localStorage.getItem(LK))}catch(e){}
  if(!S||!S.init)S=DEF();
  ready=true;
  $('#ban').innerHTML='<div class="banner">Mode local : les données restent sur cet appareil. Ajoutez la configuration Firebase pour synchroniser l’équipe.</div>';
  view();
}
alertLbl();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
setInterval(()=>{tick();checkAlerts()},1000);
</script>
